services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M

  cms:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      # secret: lives in the Dokploy Environment tab, never in this file
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: 587
      SMTP_USER: resend
      # secret: lives in the Dokploy Environment tab, never in this file
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: no-reply@lapazsipasa.com
      SMTP_FROM_NAME: La Paz Sí Pasa
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WORDPRESS_URL}');
        define('WP_SITEURL', '${WORDPRESS_URL}');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('WP_ENVIRONMENT_TYPE', 'production');
    volumes:
      - wordpress_data:/var/www/html
      - ./apps/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./apps/wordpress/scf-json:/var/www/html/wp-content/scf-json
      - ./apps/wordpress/seed:/opt/seed:ro
      - ./apps/wordpress/php/zz-opcache-overrides.ini:/usr/local/etc/php/conf.d/zz-opcache-overrides.ini
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: docker/astro/Dockerfile
      args:
        WORDPRESS_URL: ${WORDPRESS_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      WORDPRESS_URL: ${WORDPRESS_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      # secret: lives in the Dokploy Environment tab, never in this file; must match the cms service
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 384M

  # Solo para tareas puntuales (cargar contenido, migraciones). El perfil "tools"
  # lo deja fuera del despliegue normal; se levanta a mano con:
  #   docker compose -f compose.prod.yaml run --rm --user 33 wpcli wp <comando>
  wpcli:
    image: wordpress:cli-php8.3
    profiles:
      - tools
    depends_on:
      - db
      - cms
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
    volumes:
      - wordpress_data:/var/www/html
      - ./apps/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./apps/wordpress/scf-json:/var/www/html/wp-content/scf-json
      - ./apps/wordpress/seed:/opt/seed:ro

volumes:
  db_data:
  wordpress_data:
