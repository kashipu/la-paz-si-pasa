; En local los mu-plugins van bind-mounted y se editan sin reiniciar el contenedor.
; Force OPcache to re-stat the file on every request so code changes take effect
; without a manual container restart. En produccion ya no hace falta (la imagen es
; inmutable y cada cambio recrea el contenedor), pero el costo es un stat por
; archivo y no vale la pena tener dos configuraciones.
opcache.revalidate_freq=0
