# zz-: carga después del security.conf de Debian, que fija ServerTokens OS.

# Sin firma de versión de Apache en errores y cabeceras.
ServerSignature Off
ServerTokens Prod

# XML-RPC no se usa (lapaz-limpieza.php lo desactiva en WordPress). Se bloquea aquí
# para que ni siquiera arranque PHP: es un blanco habitual de fuerza bruta.
<Files "xmlrpc.php">
    Require all denied
</Files>

# Nunca ejecutar PHP desde uploads: si alguien lograra subir un .php, no correría.
<Directory "/var/www/html/wp-content/uploads">
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Definiciones de campos SCF: no son públicas.
<DirectoryMatch "^/var/www/html/wp-content/scf-json">
    Require all denied
</DirectoryMatch>

# Cabeceras de seguridad. Sin CSP por ahora: el editor de bloques y los embeds de YouTube
# necesitan una política a medida (pendiente, ver la etapa 7).
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
</IfModule>
